name: Linux validation

on:
  push:
    branches: [ci-linux-validation]

permissions: {}

jobs:
  validation:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - uses: "garnet-org/action@v2.6.0"
      - uses: "pnpm/action-setup@v4"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "22"
          package-manager-cache: false
      - name: "Install dependencies"
        run: |
          pnpm install --frozen-lockfile
        working-directory: "."
      - name: "Build prerequisites"
        run: |
          pnpm exec turbo build --filter=ai^...
        working-directory: "."
      - name: "Run checks"
        run: |
          pnpm run test:node
        working-directory: "packages/ai"
